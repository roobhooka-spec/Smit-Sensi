<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI - Oficial</title>
    
    <style>
        /* Reseta a tela para ocupar 100% do espaço */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050000;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
            font-family: 'Arial Black', Impact, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Camada do efeito de fumaça ocupando o fundo inteiro */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Texto principal centralizado na frente da fumaça */
        .conteudo {
            position: relative;
            z-index: 2;
            text-align: center;
            user-select: none;
            pointer-events: none;
        }

        .conteudo h1 {
            color: #ffffff;
            font-size: 64px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 4px 4px 0px #000000, 0 0 25px #ff0000;
            font-style: italic;
            animation: pulsar 2s ease-in-out infinite alternate;
        }

        .conteudo p {
            color: #ff3333;
            font-size: 18px;
            margin: 10px 0 0 0;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000000;
        }

        /* Efeito sutil de pulsação no brilho do texto */
        @keyframes pulsar {
            from { text-shadow: 4px 4px 0px #000000, 0 0 20px #ff0000; }
            to { text-shadow: 4px 4px 0px #000000, 0 0 40px #ff3333; }
        }

        /* Ajuste para telas de celular pequenas */
        @media (max-width: 600px) {
            .conteudo h1 { font-size: 42px; }
            .conteudo p { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Tela onde a fumaça será desenhada se movendo -->
    <canvas id="fumaca"></canvas>

    <!-- Texto fixado na frente do efeito -->
    <div class="conteudo">
        <h1>SMIT SENSI</h1>
        <p>Oficial</p>
    </div>

    <script>
        const canvas = document.getElementById('fumaca');
        const ctx = canvas.getContext('2d');

        // Ajusta o tamanho do fundo dinamicamente
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        // Configuração do sistema de partículas de fumaça
        const particulas = [];
        const quantidadeParticulas = 60; // Quantidade de nuvens de fumaça na tela

        class ParticulaFumaca {
            constructor() {
                this.resetar(true);
            }

            resetar(inicioAleatorio = false) {
                this.x = Math.random() * canvas.width;
                // Distribui na tela no início ou faz nascer debaixo
                this.y = inicioAleatorio ? Math.random() * canvas.height : canvas.height + Math.random() * 100;
                this.tamanho = Math.random() * 120 + 80; // Tamanho de cada nuvem de fumaça
                this.velX = Math.random() * 0.4 - 0.2; // Movimento pros lados
                this.velY = -(Math.random() * 0.5 + 0.2); // Sobe lentamente
                this.opacidade = Math.random() * 0.3 + 0.05; // Fumaça transparente e suave
                this.fading = Math.random() * 0.002 + 0.001;
            }

            atualizar() {
                this.x += this.velX;
                this.y += this.velY;
                this.opacidade -= this.fading;

                // Se a fumaça sumir ou passar do topo, recria embaixo
                if (this.opacidade <= 0 || this.y + this.tamanho < 0) {
                    this.resetar(false);
                }
            }

            desenhar() {
                ctx.beginPath();
                // Cria um efeito gradiente circular para simular fumaça realista
                let gradiente = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.tamanho);
                gradiente.addColorStop(0, `rgba(180, 0, 0, ${this.opacidade})`); // Vermelho no centro
                gradiente.addColorStop(0.5, `rgba(80, 0, 0, ${this.opacidade * 0.4})`); // Escurecendo nas pontas
                gradiente.addColorStop(1, 'rgba(5, 0, 0, 0)'); // Invisível na borda

                ctx.fillStyle = gradiente;
                ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Inicializa as partículas
        for (let i = 0; i < quantidadeParticulas; i++) {
            particulas.push(new ParticulaFumaca());
        }

        // Loop contínuo da animação
        function animar() {
            // Limpa a tela com tom avermelhado de fundo bem escuro
            ctx.fillStyle = '#050000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Atualiza e desenha cada pedaço da fumaça
            particulas.forEach(particula => {
                particula.atualizar();
                particula.desenhar();
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
