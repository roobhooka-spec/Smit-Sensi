<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #06020b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 🌌 SEU FUNDO DE GENGAR ROXO (IMG_4631.jpeg) */
        .site-fundo-completo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('IMG_4631.jpeg') center center/cover no-repeat;
            z-index: 1;
            filter: brightness(0.35) contrast(1.3) saturate(1.2);
            animation: movFundo 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes movFundo {
            0% { transform: scale(1); }
            100% { transform: scale(1.04) translate(2px, 2px); }
        }

        .container-loja {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        /* NAVBAR SUPERIOR PREMIUM */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 25px;
            width: 100%;
        }

        .nav-logo img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid rgba(160, 32, 240, 0.4);
            object-fit: cover;
        }

        .nav-direita {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #8a8a93;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-perfil {
            background: #a020f0;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.4);
        }

        /* SELOS ESTILIZADOS DO TOPO */
        .container-selos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .selo-info {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 7, 25, 0.6);
            backdrop-filter: blur(10px);
        }

        .selo-entrega { border: 1px solid rgba(160, 32, 240, 0.3); color: #c060ff; }
        .selo-seguro { border: 1px solid rgba(0, 230, 118, 0.3); color: #00e676; }
        .selo-verificado { border: 1px solid rgba(0, 145, 234, 0.3); color: #0091ea; width: 100%; max-width: 140px; justify-content: center; }

        /* HEADER DE BOAS VINDAS + BOLINHA CENTRAL */
        .bloco-apresentacao {
            text-align: center;
            margin-bottom: 20px;
        }

        .foto-avatar-loja {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .foto-avatar-loja img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            border: 2px solid #a020f0;
            box-shadow: 0 0 25px rgba(160, 32, 240, 0.6);
        }

        .bloco-apresentacao h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .bloco-apresentacao h1 span {
            color: #a020f0;
            text-shadow: 0 0 15px rgba(160, 32, 240, 0.5);
        }

        .desc-loja { text-align: center; font-size: 14px; color: #94a3b8; line-height: 1.6; max-width: 480px; margin: 15px auto 25px; }
        .botoes-topo-loja { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; }
        .btn-principal { background: #a020f0; color: #fff; padding: 12px 28px; border-radius: 25px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; box-shadow: 0 0 20px rgba(160, 32, 240, 0.5); display: flex; align-items: center; gap: 8px; }
        .btn-secundario { background: rgba(255, 255, 255, 0.05); color: #fff; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; }
        .btn-suporte-redondo { width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; display: flex; align-items: center; justify-content: center; margin: 10px auto 0; cursor: pointer; }
        
        .mini-selos-footer { display: flex; justify-content: center; gap: 20px; margin: 25px 0 35px; font-size: 11px; color: #64748b; font-weight: bold; }
        .mini-selos-footer b.purp { color: #a020f0; }
        .mini-selos-footer b.gren { color: #00e676; }
        .mini-selos-footer b.blu { color: #0091ea; }

        /* 📁 NOVA SEÇÃO DE CATEGORIAS (BANNERS GRANDES IGUAL A FOTO) */
        .secao-categorias {
            margin: 30px 0 15px;
            text-align: left;
        }
        .sub-catalogo {
            font-size: 11px;
            font-weight: 800;
            color: #a020f0;
            letter-spacing: 1.5px;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .titulo-catalogo {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
        }
        .titulo-catalogo span {
            color: #a020f0;
        }
        .barra-pesquisa-categoria {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .input-busca {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 10px;
            flex-grow: 1;
        }
        .input-busca input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        .input-busca input::placeholder {
            color: #4b4b53;
        }
        .btn-ver-todas {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .grade-banners-categorias {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .banner-cat {
            height: 140px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            cursor: pointer;
            border: 1px solid rgba(160, 32, 240, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }
        .info-banner-cat {
            text-align: left;
        }
        .info-banner-cat h3 {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .info-banner-cat p {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.4;
            max-width: 90%;
        }
        .filtros-rapidos-catalogo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .btn-filtro-aba {
            background: rgba(160, 32, 240, 0.15);
            color: #fff;
            border: 1px solid #a020f0;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-ver-todos-seta {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* VITRINE EM 2 COLUNAS */
        .grade-produtos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
        .card-produto { background: rgba(8, 3, 15, 0.85); border: 1px solid rgba(160, 32, 240, 0.2); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border-bottom: 3px solid #a020f0; backdrop-filter: blur(5px); }
        .escondido { display: none !important; }
        .foto-box { position: relative; aspect-ratio: 1/1; }
        .foto-box img { width: 100%; height: 100%; object-fit: cover; }
        .selo-sistema { position: absolute; top: 8px; right: 8px; padding: 3px 8px; font-size: 9px; font-weight: bold; border-radius: 4px; text-transform: uppercase; }
        .bg-ios { background: #111; color: #00d2ff; border: 1px solid #00d2ff; }
