<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050000;
        }

        /* Exibe a sua imagem original exatamente como ela é, cobrindo a tela toda */
        .fundo-imagem {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://imgbox.com');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Efeito de fumaça vermelha extra se movendo suavemente em cima */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            mix-blend-mode: screen; 
            pointer-events: none;
            opacity: 0.6; /* Deixa a fumaça de código suave para não tampar a foto principal */
        }
    </style>
</head>
<body>

    <!-- Sua foto original com letras vermelhas e Gengar -->
    <div class="fundo-imagem"></div>

    <!-- Fumaça em movimento -->
    <canvas id="fumaca"></canvas>

    <script>
        const canvas = document.getElementById('fumaca');
        const ctx = canvas.getContext('2d');

        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        const particulas = [];
        const quantidadeParticulas = 30; 

        class ParticulaFumaca {
            constructor() {
                this.resetar(true);
            }

            resetar(inicioAleatorio = false) {
                this.x = Math.random() * canvas.width;
                this.y = inicioAleatorio ? Math.random() * canvas.height : canvas.height + Math.random() * 100;
                this.tamanho = Math.random() * 200 + 150;
                this.velX = Math.random() * 0.3 - 0.15;
                this.velY = -(Math.random() * 0.4 + 0.15);
                this.opacidade = Math.random() * 0.15 + 0.05; 
                this.fading = Math.random() * 0.001 + 0.0005;
            }

            atualizar() {
                this.x += this.velX;
                this.y += this.velY;
                this.opacidade -= this.fading;

                if (this.opacidade <= 0 || this.y + this.tamanho < 0) {
                    this.resetar(false);
                }
            }

            desenhar() {
                ctx.beginPath();
                let gradiente = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.tamanho);
                gradiente.addColorStop(0, `rgba(255, 0, 0, ${this.opacidade})`); 
                gradiente.addColorStop(0.5, `rgba(120, 0, 0, ${this.opacidade * 0.3})`); 
                gradiente.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradiente;
                ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < quantidadeParticulas; i++) {
            particulas.push(new ParticulaFumaca());
        }

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particulas.forEach(particula => {
                particula.atualizar();
                particula.desenhar();
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
