<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* A imagem agora se ajusta inteira na tela sem cortes */
        .fundo-fumaca {
            position: absolute;
            width: 110%;
            height: 110%;
            background-image: url('IMG_4521.jpeg');
            background-size: contain; /* Faz a foto inteira caber na tela do celular */
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            animation: moverFundoReal 15s linear infinite alternate;
        }

        /* Movimento bem sutil e curto para não tirar a foto do lugar */
        @keyframes moverFundoReal {
            0% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }
    </style>
</head>
<body>

    <!-- Sua arte completa se movendo suavemente sem cortes -->
    <div class="fundo-fumaca"></div>

</body>
</html>
