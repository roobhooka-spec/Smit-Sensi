<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #06020b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* FUMACA DE FUNDO ROXA ESCURA */
        .site-fundo-completo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('IMG_4570.jpeg') center top/cover;
            z-index: 1;
            filter: brightness(0.25) contrast(1.3) hue-rotate(60deg) saturate(1.4);
            pointer-events: none;
        }

        .container-loja {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* NAVBAR PREMIUM SUPERIOR */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 25px;
            width: 100%;
        }

        .nav-logo img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid rgba(160, 32, 240, 0.4);
        }

        .nav-direita {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #8a8a93;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-perfil {
            background: #a020f0;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.4);
        }

        /* PAINEL DE SELOS REDONDOS */
        .container-selos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .selo-info {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 7, 25, 0.6);
            backdrop-filter: blur(10px);
        }

        .selo-entrega { border: 1px solid rgba(160, 32, 240, 0.3); color: #c060ff; }
        .selo-seguro { border: 1px solid rgba(0, 230, 118, 0.3); color: #00e676; }
        .selo-verificado { border: 1px solid rgba(0, 145, 234, 0.3); color: #0091ea; width: 100%; max-width: 140px; justify-content: center; }

        /* MEOLO DE BOAS VINDAS + FOTO */
        .bloco-apresentacao {
            text-align: center;
            margin-bottom: 20px;
        }

        .foto-avatar-loja {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .foto-avatar-loja img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            border: 2px solid #a020f0;
            box-shadow: 0 0 25px rgba(160, 32, 240, 0.6);
        }

        .bloco-apresentacao h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .bloco-apresentacao h1 span {
            color: #a020f0;
            text-shadow: 0 0 15px rgba(160, 32, 240, 0.5);
        }
    </style>
</head>
<body>

    <div class="site-fundo-completo"></div>

    <div class="container-loja">
        
        <!-- NAVBAR PREMIUM DA REFERÊNCIA -->
        <div class="header-nav">
            <div class="nav-logo"><img src="IMG_4577.jpeg" alt="Logo"></div>
            <div class="nav-direita">
                <button class="icon-btn">🔍</button>
                <button class="icon-btn">🛒</button>
                <button class="btn-perfil">👤 Perfil</button>
            </div>
        </div>

        <!-- SELOS ESTILIZADOS DO TOPO -->
        <div class="container-selos">
            <div class="selo-info selo-entrega">⚡ Entrega Automática</div>
            <div class="selo-info selo-seguro">🛡️ Compra Segura</div>
            <div class="selo-info selo-verificado">✓ Loja Verificada</div>
        </div>

        <!-- APRESENTAÇÃO CENTRAL COM A SUA FOTO -->
        <div class="bloco-apresentacao">
            <div class="foto-avatar-loja">
                <img src="IMG_4577.jpeg" alt="Smit Sensi Profile">
            </div>
            <h1>Bem-vindo à <span>Smit Sensi</span></h1>
        </div>

    </div>
</body>
</html>
