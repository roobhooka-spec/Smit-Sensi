<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Animado - SMIT SENSI</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0101;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        #banner-movel {
            position: absolute;
            width: 300px; /* Tamanho do seu banner */
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Link direto da sua imagem hospedada -->
    <img src="https://ibb.co" id="banner-movel" alt="Banner SMIT SENSI">

    <script>
        const banner = document.getElementById('banner-movel');

        let posX = Math.random() * (window.innerWidth - 300);
        let posY = Math.random() * (window.innerHeight - 250);

        let velX = 3; 
        let velY = 3;

        function moverBanner() {
            const larguraTela = window.innerWidth;
            const alturaTela = window.innerHeight;
            const larguraBanner = banner.offsetWidth;
            const alturaBanner = banner.offsetHeight;

            posX += velX;
            posY += velY;

            if (posX + larguraBanner >= larguraTela || posX <= 0) {
                velX = -velX; 
            }

            if (posY + alturaBanner >= alturaTela || posY <= 0) {
                velY = -velY; 
            }

            banner.style.left = posX + 'px';
            banner.style.top = posY + 'px';

            requestAnimationFrame(moverBanner);
        }

        window.addEventListener('load', moverBanner);

        window.addEventListener('resize', () => {
            if (posX + banner.offsetWidth > window.innerWidth) posX = window.innerWidth - banner.offsetWidth;
            if (posY + banner.offsetHeight > window.innerHeight) posY = window.innerHeight - banner.offsetHeight;
        });
    </script>
</body>
</html>
