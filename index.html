<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smit Sensi</title>
    
    <style>
        /* Configura a estrutura principal */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0c0c0e; 
            font-family: sans-serif;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        /* 📸 A SUA IMAGEM DO GENGAR COMO FUNDO ANIMADO DA TELA TODA */
        .fundo-gengar-animado {
            position: fixed;
            top: 0;
            left: 0;
            width: 130%; /* Aumentamos levemente para dar margem de movimento */
            height: 130%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            /* 🌟 O TRUQUE ESTÁ AQUI: top center faz o fundo focar na fumaça de cima e joga o texto do fundo para fora da tela */
            background-position: top center; 
            z-index: 0; 
            animation: fumaçaGengar 15s infinite ease-in-out alternate;
            pointer-events: none;
        }

        /* Animação corrigida para focar apenas no topo e laterais, escondendo a parte de baixo */
        @keyframes fumaçaGengar {
            0% {
                transform: translate(-3%, -2%) scale(1.05) rotate(0deg);
                filter: brightness(0.85) contrast(1.1);
            }
            50% {
                transform: translate(3%, 0%) scale(1.1) rotate(1deg); /* Tiramos o movimento para baixo (Y) para o texto não subir */
                filter: brightness(1.05) contrast(1.15); 
            }
            100% {
                transform: translate(-2%, -1%) scale(1.03) rotate(-0.5deg);
                filter: brightness(0.8) contrast(1);
            }
        }

        /* Camada escura por cima do fundo para destacar o conteúdo principal */
        .filtro-escuro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Deixamos um pouquinho mais escuro para o texto dos produtos destacar mais */
            z-index: 1;
            pointer-events: none;
        }

        /* Garante que o conteúdo fique por cima do fundo animado */
        .conteudo-site {
            position: relative;
            z-index: 2; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        /* Container do Banner Deitado */
        .banner-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 180px; 
            margin: 20px auto;
            border-radius: 15px;
            border: 2px solid #ff3700; 
            box-shadow: 0 0 15px rgba(255, 55, 0, 0.5);
            overflow: hidden;
        }

        /* Imagem dentro do banner */
        .banner-fundo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            background-position: center;
        }

        /* Botões iOS e Android */
        .botoes-plataforma {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin: 20px 0;
            width: 100%;
        }

        .btn-plataforma {
            width: 120px;
            padding: 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.6); 
            border: 2px solid #ff3700; 
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.4);
            backdrop-filter: blur(3px); 
        }

        /* Container dos Quadrados de Produtos */
        .produtos-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 90%;
            max-width: 450px;
            margin-top: 10px;
        }

        /* Estilo dos Cards dos Produtos */
        .card-produto {
            flex: 1;
            height: 200px;
            background: rgba(12, 12, 16, 0.75); 
            border: 2px solid #ff3700; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.3);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <!-- A SUA IMAGEM FAZENDO O PAPEL DE FUMAÇA NO SITE TODO -->
    <div class="fundo-gengar-animado"></div>
    <div class="filtro-escuro"></div>

    <!-- TODO O CONTEÚDO DO SITE -->
    <div class="conteudo-site">
        
        <!-- BANNER DEITADO -->
        <div class="banner-container">
            <div class="banner-fundo"></div>
        </div>

        <!-- BOTÕES -->
        <div class="botoes-plataforma">
            <a href="#" class="btn-plataforma">iOS</a>
            <a href="#" class="btn-plataforma">Android</a>
        </div>

        <!-- QUADRADINHOS DE PRODUTOS -->
        <div class="produtos-container">
            <div class="card-produto">PRODUTO 1<br>(AGUARDANDO FOTO)</div>
            <div class="card-produto">PRODUTO 2<br>(AGUARDANDO FOTO)</div>
        </div>

    </div>

</body>
</html>
