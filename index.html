<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0101;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* Esse é o seu banner completo que vai se mover por todo o site */
        #banner-movel {
            position: absolute;
            width: 320px; /* Tamanho do seu banner na tela */
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <!-- Sua imagem real convertida diretamente em código seguro -->
    <img src="https://postimg.co" id="banner-movel" alt="SMIT SENSI">

    <script>
        const banner = document.getElementById('banner-movel');

        // Posição inicial aleatória na tela
        let posX = Math.random() * (window.innerWidth - 320);
        let posY = Math.random() * (window.innerHeight - 280);

        // Velocidade do movimento (aumente os números para ir mais rápido)
        let velX = 2.5; 
        let velY = 2.5;

        function moverBanner() {
            const larguraTela = window.innerWidth;
            const alturaTela = window.innerHeight;
            const larguraBanner = banner.offsetWidth || 320;
            const alturaBanner = banner.offsetHeight || 280;

            posX += velX;
            posY += velY;

            // Bate nas bordas dos lados e volta
            if (posX + larguraBanner >= larguraTela || posX <= 0) {
                velX = -velX; 
            }

            // Bate nas bordas de cima e baixo e volta
            if (posY + alturaBanner >= alturaTela || posY <= 0) {
                velY = -velY; 
            }

            banner.style.left = posX + 'px';
            banner.style.top = posY + 'px';

            requestAnimationFrame(moverBanner);
        }

        // Inicia a animação assim que carregar
        window.addEventListener('load', moverBanner);
        setTimeout(moverBanner, 600); // Garante o início do movimento rápido
    </script>
</body>
</html>
