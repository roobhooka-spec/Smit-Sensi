<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #06020b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 🌌 IMAGEM 4 NO FUNDO OFICIAL */
        .site-fundo-completo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('IMG_4570.jpeg') center center/cover no-repeat;
            z-index: 1;
            filter: brightness(0.22) contrast(1.4) saturate(1.3);
            animation: movFundo 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes movFundo {
            0% { transform: scale(1); }
            100% { transform: scale(1.05) translate(2px, 2px); }
        }

        .container-loja {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        /* NAVBAR PREMIUM SUPERIOR */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 25px;
            width: 100%;
        }

        /* LOGO SUPERIOR COM A IMAGEM 4 */
        .nav-logo img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid rgba(160, 32, 240, 0.4);
            object-fit: cover;
        }

        .nav-direita {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #8a8a93;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-perfil {
            background: #a020f0;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(160, 32, 240, 0.4);
        }

        /* PAINEL DE SELOS REDONDOS */
        .container-selos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .selo-info {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 7, 25, 0.6);
            backdrop-filter: blur(10px);
        }

        .selo-entrega { border: 1px solid rgba(160, 32, 240, 0.3); color: #c060ff; }
        .selo-seguro { border: 1px solid rgba(0, 230, 118, 0.3); color: #00e676; }
        .selo-verificado { border: 1px solid rgba(0, 145, 234, 0.3); color: #0091ea; width: 100%; max-width: 140px; justify-content: center; }

        /* HEADER DE BOAS VINDAS + FOTO */
        .bloco-apresentacao {
            text-align: center;
            margin-bottom: 20px;
        }

        /* BOLINHA COM A IMAGEM 4 COBRINDO CERTINHO */
        .foto-avatar-loja {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .foto-avatar-loja img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            border: 2px solid #a020f0;
            box-shadow: 0 0 25px rgba(160, 32, 240, 0.6);
        }

        .bloco-apresentacao h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .bloco-apresentacao h1 span {
            color: #a020f0;
            text-shadow: 0 0 15px rgba(160, 32, 240, 0.5);
        }

        .desc-loja { text-align: center; font-size: 14px; color: #94a3b8; line-height: 1.6; max-width: 480px; margin: 15px auto 25px; }
        .botoes-topo-loja { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; }
        .btn-principal { background: #a020f0; color: #fff; padding: 12px 28px; border-radius: 25px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; box-shadow: 0 0 20px rgba(160, 32, 240, 0.5); display: flex; align-items: center; gap: 8px; }
        .btn-secundario { background: rgba(255, 255, 255, 0.05); color: #fff; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; }
        .btn-suporte-redondo { width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); color: #fff; display: flex; align-items: center; justify-content: center; margin: 10px auto 0; cursor: pointer; }
        
        .mini-selos-footer { display: flex; justify-content: center; gap: 20px; margin: 25px 0; font-size: 11px; color: #64748b; font-weight: bold; }
        .mini-selos-footer b.purp { color: #a020f0; }
        .mini-selos-footer b.gren { color: #00e676; }
        .mini-selos-footer b.blu { color: #0091ea; }

        /* SEÇÃO FILTRO */
        .secao-filtro { background: rgba(10, 2, 22, 0.6); border: 1px solid rgba(160, 32, 240, 0.15); border-radius: 16px; padding: 20px 15px; text-align: center; margin-top: 35px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); border-bottom: 2px solid rgba(160, 32, 240, 0.4); backdrop-filter: blur(10px); }
        .titulo-filtro { font-size: 22px; color: #a020f0; margin-bottom: 20px; text-transform: uppercase; font-weight: bold; }
        .label-grupo { font-size: 14px; color: #a020f0; margin-bottom: 10px; display: block; font-weight: bold; text-transform: uppercase; }
        .alinhamento-botoes { display: flex; justify-content: center; gap: 10px; }
        .btn-filtro { padding: 8px 20px; font-size: 12px; font-weight: bold; border-radius: 20px; cursor: pointer; background: #121212; color: #666; border: 1px solid rgba(255, 255, 255, 0.08); margin: 0 4px; text-transform: uppercase; }
        .btn-filtro.ativo { background: #a020f0; color: #fff; border-color: #a020f0; box-shadow: 0 0 12px #a020f0; }
        .btn-bloqueado { cursor: not-allowed; opacity: 0.9; }

        /* VITRINE EM 2 COLUNAS */
        .grade-produtos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 25px; }
        .card-produto { background: rgba(8, 3, 15, 0.85); border: 1px solid rgba(160, 32, 240, 0.2); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border-bottom: 3px solid #a020f0; backdrop-filter: blur(5px); }
        .escondido { display: none !important; }
        .foto-box { position: relative; aspect-ratio: 1/1; }
        .foto-box img { width: 100%; height: 100%; object-fit: cover; }
        .selo-sistema { position: absolute; top: 8px; right: 8px; padding: 3px 8px; font-size: 9px; font-weight: bold; border-radius: 4px; text-transform: uppercase; }
        .bg-ios { background: #111; color: #00d2ff; border: 1px solid #00d2ff; }
        .bg-android { background: #111; color: #00ff66; border: 1px solid #00ff66; }
        .info-prod { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
        .nome-prod { font-size: 11px; font-weight: bold; margin-bottom: 6px; min-height: 32px; text-transform: uppercase; }
        .status { font-size: 10px; color: #2de29b; font-weight: bold; margin-bottom: 10px; }
        .btn-buy { background: #a020f0; color: #fff; text-align: center; text-decoration: none; padding: 9px; font-size: 11px; font-weight: bold; border-radius: 6px; border: 1px solid #c040ff; margin-top: auto; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="site-fundo-completo"></div>

    <div class="container-loja">
        
        <!-- NAVBAR SUPERIOR COM IMAGEM 4 -->
        <div class="header-nav">
            <div class="nav-logo"><img src="IMG_4570.jpeg" alt="Logo"></div>
            <div class="nav-direita">
                <button class="icon-btn">🔍</button>
                <button class="icon-btn">🛒</button>
                <button class="btn-perfil">👤 Perfil</button>
            </div>
        </div>

        <!-- SELOS ESTILIZADOS DO TOPO -->
        <div class="container-selos">
            <div class="selo-info selo-entrega">⚡ Entrega Automática</div>
            <div class="selo-info selo-seguro">🛡️ Compra Segura</div>
            <div class="selo-info selo-verificado">✓ Loja Verificada</div>
        </div>

        <!-- BOLINHA CENTRAL COM A SUA IMAGEM 4 -->
        <div class="bloco-apresentacao">
            <div class="foto-avatar-loja">
                <img src="IMG_4570.jpeg" alt="Smit Sensi Profile">
            </div>
            <h1>Bem-vindo à <span>Smit Sensi</span></h1>
        </div>

        <p class="desc-loja">A nossa loja se destaca como a referência no mercado, oferecendo uma ampla variedade de produtos digitais com preços competitivos e qualidade incomparável.</p>
        
        <div class="botoes-topo-loja">
            <button class="btn-principal" onclick="document.querySelector('.secao-filtro').scrollIntoView({behavior:'smooth'})">Ver Produtos ❯</button>
            <button class="btn-secundario">Ver Categorias</button>
        </div>
        <button class="btn-suporte-redondo">🎧</button>
        
        <div class="mini-selos-footer">
            <span><b class="purp">⚡</b> Rápido</span>
