<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smit Sensi</title>
    
    <style>
        /* Configura a estrutura principal */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0c0c0e; 
            font-family: sans-serif;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        /* 📸 FUNDO CORRIGIDO: CORTA O TEXTO FORA E DEIXA SÓ A FUMAÇA */
        .fundo-gengar-animado {
            position: fixed;
            top: -20%; /* Sobe um pouco para focar na fumaça do topo */
            left: -20%;
            width: 140%; 
            height: 140%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            background-position: center top; 
            z-index: 0; 
            /* 🌟 O TRUQUE: Dá zoom e corta a parte de baixo (onde fica o texto gigante) */
            transform: scale(2.2); 
            clip-path: inset(0px 0px 40% 0px); 
            animation: fumaçaGengar 14s infinite ease-in-out alternate;
            pointer-events: none;
        }

        /* Animação suave simulando fumaça sem trazer o texto de volta */
        @keyframes fumaçaGengar {
            0% {
                transform: scale(2.2) translate(-2px, -2px) rotate(0deg);
                filter: brightness(0.8) contrast(1.1);
            }
            50% {
                transform: scale(2.3) translate(3px, 1px) rotate(1deg);
                filter: brightness(1.0) contrast(1.2); 
            }
            100% {
                transform: scale(2.2) translate(-1px, 2px) rotate(-1deg);
                filter: brightness(0.75) contrast(1);
            }
        }

        /* Filtro escuro para dar contraste nos botões e produtos */
        .filtro-escuro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 1;
            pointer-events: none;
        }

        /* Garante que o conteúdo fique na frente */
        .conteudo-site {
            position: relative;
            z-index: 2; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* Container do Banner Deitado */
        .banner-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 180px; 
            margin: 20px auto;
            border-radius: 15px;
            border: 2px solid #ff3700; 
            box-shadow: 0 0 15px rgba(255, 55, 0, 0.5);
            overflow: hidden;
        }

        /* Imagem estática dentro do banner */
        .banner-fundo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            background-position: center;
        }

        /* Botões iOS e Android */
        .botoes-plataforma {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin: 20px 0;
            width: 100%;
        }

        .btn-plataforma {
            width: 120px;
            padding: 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.65); 
            border: 2px solid #ff3700; 
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.4);
            backdrop-filter: blur(3px); 
        }

        /* Container dos Quadrados de Produtos */
        .produtos-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 90%;
            max-width: 450px;
            margin-top: 10px;
        }

        /* Estilo dos Cards dos Produtos */
        .card-produto {
            flex: 1;
            height: 200px;
            background: rgba(12, 12, 16, 0.8); 
            border: 2px solid #ff3700; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.3);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <!-- FUNDO COM ZOOM PARA DEIXAR APENAS A FUMAÇA SE MEXENDO -->
    <div class="fundo-gengar-animado"></div>
    <div class="filtro-escuro"></div>

    <!-- CONTEÚDO DO SITE -->
    <div class="conteudo-site">
        
        <!-- BANNER DEITADO -->
        <div class="banner-container">
            <div class="banner-fundo"></div>
        </div>

        <!-- BOTÕES -->
        <div class="botoes-plataforma">
            <a href="#" class="btn-plataforma">iOS</a>
            <a href="#" class="btn-plataforma">Android</a>
        </div>

        <!-- QUADRADINHOS DE PRODUTOS -->
        <div class="produtos-container">
            <div class="card-produto">PRODUTO 1<br>(AGUARDANDO FOTO)</div>
            <div class="card-produto">PRODUTO 2<br>(AGUARDANDO FOTO)</div>
        </div>

    </div>

</body>
</html>
