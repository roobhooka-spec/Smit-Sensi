<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050000;
        }

        /* A sua foto original esticada na tela inteira se movendo bem lento */
        .fundo-fumaca {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150%;
            height: 150%;
            background-image: url('IMG_4521.jpeg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            animation: moverFundoReal 25s linear infinite alternate;
        }

        /* Movimento suave e contínuo para dar vida à fumaça da foto */
        @keyframes moverFundoReal {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, -20px) scale(1.06); }
            100% { transform: translate(20px, -40px) scale(1); }
        }
    </style>
</head>
<body>

    <!-- Apenas a sua imagem com efeito de fumaça viva de fundo -->
    <div class="fundo-fumaca"></div>

</body>
</html>
