<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smit Sensi</title>
    
    <style>
        /* Fundo escuro do site para não ficar branco */
        body {
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Container do Banner (Deitado e Médio) */
        .banner-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 180px; 
            margin: 20px auto;
            border-radius: 15px;
            border: 2px solid #ff3700; 
            box-shadow: 0 0 15px rgba(255, 55, 0, 0.4);
            overflow: hidden;
        }

        /* Pega o segundo arquivo que você mostrou (IMG_4570.jpeg) */
        .banner-fundo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Efeito da fumaça se mexendo suave */
        .fumaça-animada {
            position: absolute;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle, rgba(255, 55, 0, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(35px);
            z-index: 2;
            animation: moverFumaca 7s infinite ease-in-out alternate;
            pointer-events: none;
        }

        @keyframes moverFumaca {
            0% { transform: translate(-8%, -8%) scale(1); }
            50% { transform: translate(4%, 4%) scale(1.15); }
            100% { transform: translate(-4%, 2%) scale(0.95); }
        }

        /* Botões iOS e Android na mesma linha */
        .botoes-plataforma {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin: 20px 0;
        }

        /* Mesma cor e estilo para os dois botões */
        .btn-plataforma {
            width: 120px;
            padding: 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            background-color: transparent;
            border: 2px solid #ff3700; 
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- BANNER COM A SUA IMAGEM IMG_4570.jpeg E FUMAÇA -->
    <div class="banner-container">
        <div class="banner-fundo"></div>
        <div class="fumaça-animada"></div>
    </div>

    <!-- BOTÕES NA MESMA COR -->
    <div class="botoes-plataforma">
        <a href="#" class="btn-plataforma">iOS</a>
        <a href="#" class="btn-plataforma">Android</a>
    </div>

</body>
</html>
