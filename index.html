<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI - Official Store</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 1. SEU FUNDO FIXO EM MOVIMENTO LENTO */
        .site-fundo-completo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('IMG_4570.jpeg');
            background-size: cover;
            background-position: center top;
            z-index: 1;
            filter: brightness(0.45) contrast(1.4) saturate(1.5); 
            animation: movimentoFumacaFixed 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes movimentoFumacaFixed {
            0% { transform: scale(1); }
            100% { transform: scale(1.04) translate(3px, 3px); }
        }

        /* CONTAINER PRINCIPAL */
        .container-loja {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px; 
            margin: 0 auto;
            padding: 35px 12px 30px 12px;
        }

        /* 2. BANNER DO TOPO CENTRALIZADO E MAIOR */
        .topo-banner-master {
            width: 100%;
            padding-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .topo-banner-master img {
            width: 85%; 
            max-width: 400px; 
            height: auto;
            border-radius: 12px;
            border: 2px solid #ff1a1a;
            box-shadow: 0 0 25px rgba(255, 26, 26, 0.45);
            animation: balancoBanner 5s ease-in-out infinite alternate;
        }

        @keyframes balancoBanner {
            0% { transform: translateY(-4px); filter: brightness(1.05); }
            100% { transform: translateY(4px); filter: brightness(0.95); }
        }

        /* VANTAGENS EXCLUSIVAS */
        .secao-vantagens {
            margin: 35px 0;
            text-align: center;
        }

        .titulo-vantagens {
            font-size: 24px;
            font-weight: 800;
            color: #ff1a1a; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.4);
        }

        .grade-vantagens {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card-vantagem {
            background: rgba(15, 5, 5, 0.85);
            border: 1px solid rgba(255, 26, 26, 0.15);
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .icone-vantagem {
            width: 36px;
            height: 36px;
            margin-bottom: 12px;
            fill: #ff1a1a; 
            filter: drop-shadow(0 0 8px rgba(255, 26, 26, 0.6));
        }

        .card-vantagem h3 {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-vantagem p {
            font-size: 11px;
            color: #b3b3b3;
            line-height: 1.4;
        }

        /* SELETOR DE CATEGORIAS */
        .abas-categorias {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 35px 0 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }

        .aba-btn {
            padding: 10px 28px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px; 
            cursor: pointer;
            background-color: #0d0202; 
            color: #ffffff; 
            border: 2px solid #ff1a1a; 
            box-shadow: 0 0 12px rgba(255, 26, 26, 0.2); 
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
        }

        .aba-btn.ativo {
            background-color: #ff1a1a;
            box-shadow: 0 0 18px rgba(255, 26, 26, 0.6);
        }

        /* VITRINE DE PRODUTOS CORRIGIDA (IGUAL À REFERÊNCIA) */
        .grade-produtos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .card-produto {
            background: rgba(12, 3, 3, 0.85);
            border: 1px solid rgba(255, 26, 26, 0.2);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid rgba(255, 26, 26, 0.4);
        }

        /* Container da foto quadrada */
        .foto-container {
            width: 100%;
            position: relative;
            background-color: #111;
            aspect-ratio: 1 / 1; 
        }

        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Selo do Sistema no Card */
        .selo-sistema {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .bg-ios { background-color: #1a1a1a; color: #00d2ff; border-color: #00d2ff; }
        .bg-android { background-color: #1a1a1a; color: #00ff66; border-color: #00ff66; }

        /* Infos internas do produto */
        .info-produto {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Estrelas Amarelas */
        .avaliacao {
            display: flex;
            align-items: center;
            font-size: 10px;
            color: #ffc107;
            margin-bottom: 5px;
        }
        .avaliacao span {
            color: #fff;
            margin-left: 4px;
            font-weight: bold;
        }

        /* Título do item (Sempre Free Fire) */
        .nome-produto {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Status de entrega imediata com raio verde igual ao print */
        .entrega-status {
            display: flex;
            align-items: center;
            font-size: 10px;
            color: #2de29b;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .entrega-status svg {
            margin-right: 4px;
            fill: #2de29b;
        }

        /* Botão Vermelho de Compra */
        .btn-comprar {
            background: #ff1a1a;
            color: #fff;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.2s;
            margin-top: auto;
            border: 1px solid #ff5555;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 26, 26, 0.3);
        }
        .btn-comprar:active {
            transform: scale(0.97);
            background: #b30000;
        }
    </style>
</head>
