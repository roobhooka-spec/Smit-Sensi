<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0101;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* Banner com a imagem exata do Gengar e SMIT SENSI */
        #banner-movel {
            position: absolute;
            width: 320px; 
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
            border: 2px solid #ff1a1a;
        }
    </style>
</head>
<body>

    <!-- Link otimizado e direto com a imagem original -->
    <img src="https://imgbox.com" id="banner-movel" alt="SMIT SENSI">

    <script>
        const banner = document.getElementById('banner-movel');

        let posX = Math.random() * (window.innerWidth - 320);
        let posY = Math.random() * (window.innerHeight - 280);

        let velX = 2.5; 
        let velY = 2.5;

        function moverBanner() {
            const larguraTela = window.innerWidth;
            const alturaTela = window.innerHeight;
            const larguraBanner = banner.offsetWidth || 320;
            const alturaBanner = banner.offsetHeight || 280;

            posX += velX;
            posY += velY;

            if (posX + larguraBanner >= larguraTela || posX <= 0) {
                velX = -velX; 
            }

            if (posY + alturaBanner >= alturaTela || posY <= 0) {
                velY = -velY; 
            }

            banner.style.left = posX + 'px';
            banner.style.top = posY + 'px';

            requestAnimationFrame(moverBanner);
        }

        window.addEventListener('load', moverBanner);
        setTimeout(moverBanner, 500); 
    </script>
</body>
</html>
