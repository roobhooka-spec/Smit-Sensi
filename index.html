<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smit Sensi</title>
    
    <style>
        /* Configura a estrutura principal */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0c0c0e; 
            font-family: sans-serif;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        /* 📸 FUNDO USANDO A PRIMEIRA IMAGEM DA LISTA (MAIS LARGA) */
        .fundo-gengar-animado {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%; 
            height: 120%;
            background-image: url('IMG_4521.jpeg'); /* 🌟 Mudamos para a imagem mais larga de 1h atrás */
            background-size: cover;
            background-position: center center; 
            z-index: 0; 
            animation: fumaçaGengar 12s infinite ease-in-out alternate;
            pointer-events: none;
        }

        /* Animação suave para fazer a fumaça se mexer */
        @keyframes fumaçaGengar {
            0% {
                transform: translate(-2px, -2px) scale(1.05) rotate(0deg);
                filter: brightness(0.9) contrast(1.1);
            }
            50% {
                transform: translate(3px, 3px) scale(1.1) rotate(1deg);
                filter: brightness(1.1) contrast(1.2); 
            }
            100% {
                transform: translate(-1px, 1px) scale(1.02) rotate(-1deg);
                filter: brightness(0.8) contrast(1);
            }
        }

        /* 🌟 O TRUQUE PARA APAGAR O NOME DO FUNDO:
           Esse filtro escurece bastante o centro (onde fica o texto) e deixa as pontas com os Gengars e a fumaça aparecendo perfeitamente */
        .filtro-escuro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(12, 12, 14, 0.92) 20%, rgba(0, 0, 0, 0.4) 80%); 
            z-index: 1;
            pointer-events: none;
        }

        /* Garante que o conteúdo fique na frente */
        .conteudo-site {
            position: relative;
            z-index: 2; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* Container do Banner Deitado */
        .banner-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 180px; 
            margin: 20px auto;
            border-radius: 15px;
            border: 2px solid #ff3700; 
            box-shadow: 0 0 15px rgba(255, 55, 0, 0.5);
            overflow: hidden;
        }

        /* Imagem estática dentro do banner (Mantemos a IMG_4570 que já estava perfeita ali) */
        .banner-fundo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            background-position: center;
        }

        /* Botões iOS e Android */
        .botoes-plataforma {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin: 20px 0;
            width: 100%;
        }

        .btn-plataforma {
            width: 120px;
            padding: 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            background-color: rgba(0, 0, 0, 0.7); 
            border: 2px solid #ff3700; 
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.4);
            backdrop-filter: blur(3px); 
        }

        /* Container dos Quadrados de Produtos */
        .produtos-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 90%;
            max-width: 450px;
            margin-top: 10px;
        }

        /* Estilo dos Cards dos Produtos */
        .card-produto {
            flex: 1;
            height: 200px;
            background: rgba(12, 12, 16, 0.85); 
            border: 2px solid #ff3700; 
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.3);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <!-- A IMAGEM MAIS LARGA (IMG_4521.jpeg) COM O MEIO CAMUFLADO -->
    <div class="fundo-gengar-animado"></div>
    <div class="filtro-escuro"></div>

    <!-- CONTEÚDO DO SITE -->
    <div class="conteudo-site">
        
        <!-- BANNER DEITADO -->
        <div class="banner-container">
            <div class="banner-fundo"></div>
        </div>

        <!-- BOTÕES -->
        <div class="botoes-plataforma">
            <a href="#" class="btn-plataforma">iOS</a>
            <a href="#" class="btn-plataforma">Android</a>
        </div>

        <!-- QUADRADINHOS DE PRODUTOS -->
        <div class="produtos-container">
            <div class="card-produto">PRODUTO 1<br>(AGUARDANDO FOTO)</div>
            <div class="card-produto">PRODUTO 2<br>(AGUARDANDO FOTO)</div>
        </div>

    </div>

</body>
</html>
