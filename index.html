<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smit Sensi</title>
    
    <style>
        /* Fundo escuro do site fixo */
        body {
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* 💨 FUMAÇA QUE MEXE NA TELA COMPLETA (FUNDO) */
        .fumaça-tela-cheia {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%; 
            height: 200%;
            background: radial-gradient(circle, rgba(255, 55, 0, 0.15) 0%, rgba(0, 0, 0, 0) 60%),
                        radial-gradient(circle at 70% 80%, rgba(255, 30, 0, 0.12) 0%, rgba(0, 0, 0, 0) 50%);
            filter: blur(50px);
            z-index: 0; 
            animation: moverFumacaFundo 12s infinite ease-in-out alternate;
            pointer-events: none;
        }

        @keyframes moverFumacaFundo {
            0% { transform: translate(-10%, -10%) scale(1) rotate(0deg); }
            50% { transform: translate(5%, 10%) scale(1.2) rotate(5deg); }
            100% { transform: translate(-5%, 0%) scale(0.95) rotate(-5deg); }
        }

        /* Garante que o conteúdo fique por cima da fumaça do fundo */
        .conteudo-site {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container do Banner Deitado */
        .banner-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 180px; 
            margin: 20px auto;
            border-radius: 15px;
            border: 2px solid #ff3700; 
            box-shadow: 0 0 15px rgba(255, 55, 0, 0.4);
            overflow: hidden;
        }

        /* Sua imagem de fundo do banner */
        .banner-fundo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('IMG_4570.jpeg'); 
            background-size: cover;
            background-position: center;
        }

        /* Botões iOS e Android */
        .botoes-plataforma {
            display: flex;
            justify-content: center;
            gap: 15px; 
            margin: 20px 0;
            width: 100%;
        }

        .btn-plataforma {
            width: 120px;
            padding: 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            background-color: transparent;
            border: 2px solid #ff3700; 
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.3);
        }

        /* --- CONTAINER DOS QUADRADOS DE PRODUTOS --- */
        .produtos-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 90%;
            max-width: 450px;
            margin-top: 10px;
        }

        /* Estilo dos Cards (Preto transparente com borda da cor do tema) */
        .card-produto {
            flex: 1;
            height: 200px;
            background: rgba(18, 18, 22, 0.65); /* Escuro transparente para ver a fumaça atrás */
            border: 2px solid #ff3700; /* Mesma cor dos botões */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 55, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- FUMAÇA SE MEXENDO POR TRÁS DE TUDO -->
    <div class="fumaça-tela-cheia"></div>

    <!-- CONTEÚDO DO SITE -->
    <div class="conteudo-site">
        
        <!-- BANNER COM A SUA IMAGEM VERMELHA -->
        <div class="banner-container">
            <div class="banner-fundo"></div>
        </div>

        <!-- BOTÕES -->
        <div class="botoes-plataforma">
            <a href="#" class="btn-plataforma">iOS</a>
            <a href="#" class="btn-plataforma">Android</a>
        </div>

        <!-- QUADRADINHOS DE PRODUTOS IGUAIS A FOTO -->
        <div class="produtos-container">
            <div class="card-produto">PRODUTO 1<br>(AGUARDANDO FOTO)</div>
            <div class="card-produto">PRODUTO 2<br>(AGUARDANDO FOTO)</div>
        </div>

    </div>

</body>
</html>
