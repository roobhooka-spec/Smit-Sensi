<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMIT SENSI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #040005;
            font-family: sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* FUNDO DE FUMAÇA EM ROXO NEON */
        .site-fundo-completo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('IMG_4570.jpeg') center top/cover;
            z-index: 1;
            filter: brightness(0.4) contrast(1.4) hue-rotate(60deg) saturate(1.6);
            animation: mov 18s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes mov {
            100% { transform: scale(1.04) translate(3px, 3px); }
        }

        .container-loja {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 25px 14px;
        }

        /* 👑 ESTILO DO LETREIRO DE BOAS-VINDAS ROXO NEON */
        .secao-boas-vindas {
            background: rgba(5, 2, 10, 0.85);
            border: 2px solid rgba(160, 32, 240, 0.3);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.2), inset 0 0 15px rgba(160, 32, 240, 0.1);
            border-bottom: 4px solid #a020f0;
        }

        .secao-boas-vindas h1 {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(160, 32, 240, 0.8), 0 0 30px rgba(160, 32, 240, 0.4);
            margin-bottom: 8px;
        }

        .secao-boas-vindas p {
            font-size: 13px;
            color: #b3b3b3;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .titulo-secao {
            font-size: 24px;
            font-weight: 900;
            color: #a020f0;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(160, 32, 240, 0.6);
        }

        /* GRADE DE VANTAGENS EXCLUSIVAS EM 2 COLUNAS */
        .secao-vantagens {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 35px;
            text-align: center;
        }

        .card-vantagem {
            background: rgba(5, 2, 10, 0.85);
            border: 1px solid rgba(160, 32, 240, 0.25);
            border-radius: 16px;
            padding: 25px 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            border-bottom: 3px solid rgba(160, 32, 240, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icone-vantagem {
            font-size: 32px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 8px rgba(160, 32, 240, 0.8));
        }

        .card-vantagem h3 {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .card-vantagem p {
            font-size: 11px;
            color: #b3b3b3;
            line-height: 1.5;
        }

        /* COMO FUNCIONA A COMPRA */
        .secao-passos {
            margin: 35px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-passo {
            background: rgba(5, 2, 10, 0.85);
            border: 1px solid rgba(160, 32, 240, 0.25);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid rgba(160, 32, 240, 0.5);
        }

        .num-passo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a020f0, #400080);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(160, 32, 240, 0.5);
        }

        .texto-passo h3 {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .texto-passo p {
            font-size: 12px;
            color: #b3b3b3;
            line-height: 1.4;
        }

        .texto-passo strong {
            color: #a020f0;
        }

        .divisor {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 35px 0;
            width: 100%;
        }

        /* SEÇÃO FILTRO */
        .secao-filtro {
            background: rgba(5, 2, 10, 0.85);
            border: 1px solid rgba(160, 32, 240, 0.25);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            margin-top: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid rgba(160, 32, 240, 0.5);
        }

        .titulo-filtro {
            font-size: 24px;
            color: #a020f0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .label-grupo {
            font-size: 15px;
            color: #a020f0;
            margin-bottom: 10px;
            display: block;
            font-weight: bold;
            text-transform: uppercase;
        }

        .alinhamento-botoes {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-filtro {
            padding: 8px 20px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            background: #121212;
            color: #666;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 0 4px;
            text-transform: uppercase;
        }

        .btn-filtro.ativo {
            background: #a020f0;
            color: #fff;
            border-color: #a020f0;
            box-shadow: 0 0 12px #a020f0;
        }

        .btn-bloqueado {
            cursor: not-allowed;
            opacity: 0.9;
        }

        /* VITRINE EM 2 COLUNAS LADO A LADO */
        .grade-produtos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .card-produto {
            background: rgba(8, 3, 15, 0.9);
            border: 1px solid rgba(160, 32, 240, 0.25);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-bottom: 3px solid #a020f0;
        }

        .escondido {
            display: none !important;
        }

        .foto-box {
            position: relative;
            aspect-ratio: 1/1;
        }

        .foto-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .selo-sistema {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .bg-ios {
            background: #111;
            color: #00d2ff;
            border: 1px solid #00d2ff;
        }

        .bg-android {
            background: #111;
            color: #00ff66;
            border: 1px solid #00ff66;
        }

        .info-prod {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .nome-prod {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
            min-height: 32px;
            text-transform: uppercase;
        }

        .status {
            font-size: 10px;
            color: #2de29b;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-buy {
            background: #a020f0;
            color: #fff;
            text-align: center;
            text-decoration: none;
            padding: 9px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #c040ff;
            margin-top: auto;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="site-fundo-completo"></div>

    <div class="container-loja">
        
        <!-- 👑 NOVO PAINEL DE BOAS-VINDAS NO TOPO -->
        <div class="secao-boas-vindas">
            <h1>Seja Bem-Vindo</h1>
            <p>Aproveite os melhores painéis do mercado</p>
        </div>

        <!-- SEÇÃO VANTAGENS EXCLUSIVAS -->
        <h2 class="titulo-secao">Vantagens Exclusivas</h2>
        <div class="secao-vantagens">
            <div class="card-vantagem">
                <div class="icone-vantagem">🚚</div>
                <h3>Entrega Imediata</h3>
                <p>Liberação automática após a compra. Você recebe instantaneamente o seu produto.</p>
            </div>
            <div class="card-vantagem">
                <div class="icone-vantagem">🎧</div>
                <h3>Suporte 24h</h3>
