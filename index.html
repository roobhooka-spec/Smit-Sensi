<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smit Sensi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050508;
            /* 🔗 Aponta diretamente para o arquivo IMG_4631.jpeg do seu GitHub */
            background-image: url("IMG_4631.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-icon {
            font-size: 1.4rem;
            cursor: pointer;
        }

        .mini-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #9b22fa;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-icon, .cart-icon {
            font-size: 1.2rem;
            cursor: pointer;
        }

        .profile-btn {
            background-color: #9b22fa;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            text-decoration: none;
        }

        /* --- APRESENTAÇÃO --- */
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .main-logo-box {
            width: 120px;
            height: 120px;
            margin: 15px auto;
            border-radius: 25px;
            padding: 2px;
            background: linear-gradient(145deg, #9b22fa, #410674);
            box-shadow: 0 0 20px rgba(155, 34, 250, 0.4);
        }

        .main-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 23px;
            background-color: #10051d;
        }

        .welcome-text {
            font-size: 1.7rem;
            font-weight: 800;
            margin-top: 10px;
        }

        .highlight-text { color: #bc6eff; }

        /* --- SEÇÃO DE CATÁLOGO --- */
        .catalog-section {
            margin-top: 20px;
        }

        .section-tag {
            color: #bc6eff;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .section-title span { color: #bc6eff; }

        /* --- BARRA DE BUSCA --- */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            background-color: rgba(20, 20, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-filter {
            background-color: rgba(20, 20, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            white-space: nowrap;
        }

        /* --- LINHA DE SELEÇÃO DE PRODUTOS --- */
        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px 0;
        }

        .active-filter-btn {
            background-color: rgba(155, 34, 250, 0.15);
            border: 1px solid #9b22fa;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .view-all {
            color: #a4b0be;
            font-size: 0.85rem;
            text-decoration: none;
        }

        /* --- NOVO DESIGN DO GRID DE PRODUTOS --- */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-item {
            background-color: rgba(12, 12, 18, 0.85);
            border: 1px solid rgba(155, 34, 250, 0.2);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .item-thumb-box {
            position: relative;
            width: 100%;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #0a0412;
            margin-bottom: 10px;
        }

        .item-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-icon {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: #9b22fa;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .item-title {
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
            min-height: 34px; /* Mantém os títulos alinhados */
        }

        /* --- PREÇO E BOTÃO INTERNOS --- */
        .item-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .item-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: #22c55e;
        }

        .item-buy-btn {
            background-color: #9b22fa;
            color: white;
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s;
        }

        .item-buy-btn:active {
            background-color: #7916c7;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="menu-icon">☰</span>
                <img class="mini-logo" src="IMG_4521.jpeg" alt="Mini Logo">
            </div>
            <div class="header-actions">
                <span class="search-icon">🔍</span>
                <span class="cart-icon">🛒</span>
                <a href="#" class="profile-btn">👤 Perfil</a>
            </div>
        </header>

        <!-- Seção Inicial -->
        <section class="hero">
            <div class="main-logo-box">
                <img class="main-logo" src="IMG_4521.jpeg" alt="Logo Central">
            </div>
            <h1 class="welcome-text">Bem-vindo à <span class="highlight-text">Smit Sensi</span></h1>
        </section>

        <!-- Seção do Catálogo -->
        <section class="catalog-section">
            <div class="section-tag">Navegue pelo catálogo</div>
            <h2 class="section-title">Escolha sua <span>categoria</span></h2>

            <div class="search-container">
                <input type="text" class="search-input" placeholder="Buscar categoria...">
                <a href="#" class="btn-filter">Ver todas ›</a>
            </div>

            <!-- Listagem de Itens Individuais com preço e compra -->
            <div class="products-grid">
                
                <!-- Card do Produto 1 -->
                <div class="grid-item">
                    <div class="item-thumb-box">
                        <span class="badge-icon">⚡</span>
                        <img class="item-thumb" src="IMG_4570.jpeg" alt="Produto 1">
                    </div>
                    <div class="item-title">PAINEL SAFE ANDROID - ACESSO SEMANAL</div>
                    <div class="item-footer">
                        <div class="item-price">R$ 29,90</div>
                        <!-- Insira o link do seu meio de pagamento no href abaixo -->
                        <a href="#" class="item-buy-btn">Comprar</a>
                    </div>
                </div>

                <!-- Card do Produto 2 -->
                <div class="grid-item">
                    <div class="item-thumb-box">
                        <span class="badge-icon">⚡</span>
                        <img class="item-thumb" src="IMG_4577.jpeg" alt="Produto 2">
                    </div>
                    <div class="item-title">PAINEL SAFE ANDROID - ACESSO MENSAL</div>
                    <div class="item-footer">
                        <div class="item-price">R$ 59,90</div>
                        <!-- Insira o link do seu meio de pagamento no href abaixo -->
                        <a href="#" class="item-buy-btn">Comprar</a>
                    </div>
